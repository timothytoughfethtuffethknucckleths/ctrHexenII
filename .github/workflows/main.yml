name: Build 3DS Homebrew

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget unzip libc6-i386 lib32stdc++6

      - name: Download and Install devkitARM Toolchain
        run: |
          sudo mkdir -p /opt/devkitpro
          
          # Fetch and unpack the core devkitARM compiler sets
          wget https://github.com
          sudo tar -xf devkitARM_r56-linux.tar.xz -C /opt/devkitpro/
          
          # Extract core libctru framework files into place
          sudo mkdir -p /opt/devkitpro/libctru
          wget https://github.com
                    sudo tar -xf libctru-2.1.2.tar.bz2 -C /opt/devkitpro/libctru/

          # Fetch and install 3dsxtool, bannertool, and makerom utilities
          wget https://github.com
          sudo unzip -o makerom-v0.17-ubuntu_x86_64.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/makerom

      - name: Compile Game
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export C_INCLUDE_PATH=$DEVKITPRO/libctru/include:$C_INCLUDE_PATH
          export CPLUS_INCLUDE_PATH=$DEVKITPRO/libctru/include:$CPLUS_INCLUDE_PATH
          export LIBRARY_PATH=$DEVKITPRO/libctru/lib:$LIBRARY_PATH
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make clean
          make

      - name: Upload Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: ctrHexenII-Build
          path: |
            *.cia
            *.3dsx
