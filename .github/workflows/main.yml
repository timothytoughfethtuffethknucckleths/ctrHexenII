name: Build 3DS Homebrew

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Container Keys & Dependencies
        run: |
          # 1. Initialize and sync pacman keys so download feeds aren't blocked
          pacman-key --init
          pacman-key --populate archlinux devkitpro
          
          # 2. Synchronize databases and pull standard 3DS libraries
          dkp-pacman -Syyu --noconfirm
          dkp-pacman -S 3ds-dev 3ds-curl 3ds-bzip2 3ds-libkhax wget unzip --noconfirm

      - name: Fetch Compilation Tools (makerom)
        run: |
          # 3. Pull makerom directly using native wget inside the workspace
          wget https://github.com
          unzip makerom-v0.17-ubuntu_x86_64.zip
          mv makerom /opt/devkitpro/tools/bin/
          chmod +x /opt/devkitpro/tools/bin/makerom

      - name: Compile Game
        run: |
          # 4. Explicitly define compiling targets
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make clean
          make

      - name: Upload Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: ctrHexenII-Build
          path: |
            *.cia
            *.3dsx
