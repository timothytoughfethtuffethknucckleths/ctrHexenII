name: Build 3DS Homebrew

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        run: |
          # 1. Clear any lock files and explicitly update package databases 
          # 2. devkitPro containers run as root, so remove 'sudo' if you had it, and use explicit non-interactive flags.
          dkp-pacman -Syyu --noconfirm
          
          # 3. Ensure essential build tools are present
          dkp-pacman -S 3ds-dev 3ds-curl 3ds-bzip2 3ds-libkhax --noconfirm

      - name: Compile Game
        # 4. We must pass the correct devkitPro paths into the environment so 'make' can find them.
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
                   export PATH=$DEVKITPRO/tools/bin:$PATH
          make clean
          make

      - name: Upload Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: ctrHexenII-Build
          path: |
            *.cia
            *.3dsx
